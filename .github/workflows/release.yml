name: Release

# Publish a release on GitHub (Releases → Draft a new release, with a new tag that matches
# manifest.json's version, e.g. 0.1.0) — or push such a tag. This workflow then builds the
# plugin and attaches main.js, manifest.json and styles.css: the files Obsidian, manual
# installs and BRAT need.
on:
  push:
    tags: ["*"]
  release:
    types: [published]

permissions:
  contents: write

# Publishing in the UI can fire both triggers; run them one after the other.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check the tag matches manifest.json
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $VERSION"
            exit 1
          fi
      - name: Create the release or attach missing files to it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A version's files never change, so only upload what is missing: replacing files that
        # are already there would briefly break downloads (e.g. a BRAT update check).
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing=$(gh release view "$TAG" --json assets -q '.assets[].name')
            for f in main.js manifest.json styles.css; do
              if printf '%s\n' "$existing" | grep -qx "$f"; then
                echo "$f is already attached"
              else
                gh release upload "$TAG" "$f"
              fi
            done
          else
            gh release create "$TAG" --title "$TAG" --generate-notes main.js manifest.json styles.css
          fi
